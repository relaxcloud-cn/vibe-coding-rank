name = "vibe-coding-rank"
main = "worker/index.js"
compatibility_date = "2026-05-07"

# Change this to the final yisec subdomain before deploy.
routes = [
  { pattern = "vibe.yisec.com", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "REPORTS"
id = "replace-with-cloudflare-kv-namespace-id"
